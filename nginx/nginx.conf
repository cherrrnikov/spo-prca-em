events {
    worker_connections 1024;
}

http {
    upstream auth_service {
        server auth:8080;
    }

    upstream backend_service {
        server backend:8081;
    }

    upstream frontend_service {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name localhost;

        # Auth API
        location /api/auth/ {
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend API
        location /api/ {
            proxy_pass http://backend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Swagger UI для auth
        location /auth/swagger-ui/ {
            proxy_pass http://auth_service/swagger-ui/;
        }

        location /auth/v3/api-docs {
            proxy_pass http://auth_service/v3/api-docs;
        }

        # Swagger UI для backend
        location /backend/swagger-ui/ {
            proxy_pass http://backend_service/swagger-ui/;
        }

        location /backend/v3/api-docs {
            proxy_pass http://backend_service/v3/api-docs;
        }

        # Frontend (всё остальное)
        location / {
            proxy_pass http://frontend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}