spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  
  cache:
    type: redis
    redis:
      time-to-live: 1800000
  
  data:
    redis:
      host: redis
      port: 6379

logging:
  level:
    root: INFO
    '[ru.laspace.spo]': DEBUG
