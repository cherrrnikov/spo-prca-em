spring:
  security:
    user:
      name: admin
      password: admin
  
  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  
  cache:
    type: redis
    redis:
      time-to-live: 1800000
  
  data:
    redis:
      host: redis
      port: 6379

server:
  port: 8080

logging:
  level:
    root: INFO
    '[ru.laspace.spo]': DEBUG

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000
  issuer: spo-app

security:
  max-failed-attempts: 5
  account-lock-duration-minutes: 15
  enable-brute-force-protection: true
  login-delay-millis: 1000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html